<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee direction="right" behavior="alternate" bgcolor="yellow">
        <h1>welcome to HTML</h1>
    </marquee>

    <marquee direction="down" bgcolor="yellow" height="200px">
        <h1>hello welcome to HTML</h1>
    </marquee>

    <marquee direction="right" scrolldelay="400" behavior="alternate" bgcolor="yellow">
        <h1>welcome to HTML</h1>
    </marquee>

    <marquee direction="down" scrollamount="50" behavior="alternate" bgcolor="yellow" height="200px">
        <h1>hello welcome to HTML</h1>
    </marquee>

</body>
</html>
