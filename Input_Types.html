<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Types Example</h2>
    <form>
        <label>Enter name</label>
        <input type="text" placeholder="Enter name"/>

        <lable>Enter email</lable>
        <input type="email" placeholder="Enter email"/>
        <br><br>
        <label>Addhar number</label>
        <input type="number" placeholder="Enter number"/>

        <label>Enter Password</label>
        <input type="Password" placeholder="Enter password"/>
        <br><br>

        <label>Enter DOB</label>
        <input type="date"/>

        <label>Enter month</label>
        <input type="month"/>
        <br><br>
        <label>Enter Week</label>
        <input type="week"/>

        <label>Enter Time</label>
        <input type="time"/>
        <br><br>
        <label>Enter Date and Time</label>
        <input type="datetime"/>

        <br><br>
        <label>Choose cities</label>
        <input type="checkbox" checked/>Mumbai
        <input type="checkbox" checked/>Delhi
        <input type="checkbox" checked/>Banglore
        <input type="checkbox" checked/>Chennai
        <input type="checkbox" checked/>Pune
        <br><br>
        <label>Select Gender</label>
        <input type="radio" name="Gender"/>Male
        <input type="radio" name="Gender"/>Femle
        <input type="radio" name="Gender"/>Other

        <br><br>
        <label>Select color</label>
        <input type="color"/>

        <label>select range</label>
        <input type="range"/>
        <br><br>
        <label>upload docs</label>
        <input type="file" multiple/>
        <br><br>
        <label>search</label>
        <input type="search" placeholder="type here to search..."/>

        <label>Enter URL</label>
        <input type="url" placeholder="https://example.com"/>
        <br><br>

        <label>Enter telephone</label>
        <input type="tel" placeholder="6235624783"/>
        <br><br>
        <label>Select city</label>
        <select>
            <option>choose your city...</option>
            <option>Mumbai</option>
            <option>Pune</option>
            <option>Nashik</option>
            <option>Jalgaon</option>
            <option>Nagpur</option>
        </select>
        <label>Enter Address</label>
        <textarea rows="5" cols="20">/</textarea>
        <br><br>
        <input type="submit" value="submit form"/>
        <input type="button" value="submit form"/>
        <input type="reset" value="reset form"/>
        <br><br><br><br>

        
    </form>
</body>
</html>
