    <table border="1">
        <thead>

            <tr>
                <td rowspan="5">Web Design</td>
                <td>html</td>
            </tr>

                <td>css</td>
            </tr>
            <tr>
                <td>Bootstrap</td>

            <tr>
                <td>JS</td>
            </tr>
            <tr>
                <td rowspan="4">graphic design</td>
                <td>adobe photoshop</td>
            </tr>

        
        </tbody>
    </table>

</html>
